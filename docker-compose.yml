services:
  # Training dengan AMD GPU Radeon RX Vega 56 / 64 (ROCm 6.1 compatible build)
  train-gpu-vega:
    build:
      context: .
      dockerfile: Dockerfile.vega
    container_name: iotong-train-gpu-vega
    ipc: host
    shm_size: '8g'
    security_opt:
      - seccomp:unconfined
    environment:
      - HSA_OVERRIDE_GFX_VERSION=9.0.0
      - PYTORCH_NO_HIP_MEMORY_CACHING=1
      - HSA_ENABLE_SDMA=0
      - MIOPEN_FIND_MODE=2
      - MIOPEN_USER_DB_PATH=/tmp/miopen
      - DEVICE=0
      - EPOCHS=50
      - BATCH=16
      - IMGSZ=640
      - WORKERS=2
      - AMP=False
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - render
    volumes:
      - .:/app
    working_dir: /app
    command: python train_yolo.py

  # Training dengan AMD GPU modern (RDNA 2/3, CDNA 2/3 via official ROCm image)
  train-gpu:
    image: ultralytics/ultralytics:latest-amd
    container_name: iotong-train-gpu
    ipc: host
    security_opt:
      - seccomp:unconfined
    environment:
      - HSA_OVERRIDE_GFX_VERSION=9.0.0
      - DEVICE=0
      - EPOCHS=50
      - BATCH=16
      - IMGSZ=640
      - AMP=False
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - render
    volumes:
      - .:/app
    working_dir: /app
    command: python train_yolo.py

  # Fallback training menggunakan CPU jika driver ROCm host belum siap
  train-cpu:
    image: ultralytics/ultralytics:latest-cpu
    container_name: iotong-train-cpu
    environment:
      - DEVICE=cpu
      - EPOCHS=50
      - BATCH=16
      - IMGSZ=640
    volumes:
      - .:/app
    working_dir: /app
    command: python train_yolo.py

  # Build lokal dari Dockerfile
  train-custom:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iotong-train-custom
    environment:
      - DEVICE=cpu
      - EPOCHS=50
      - BATCH=16
      - IMGSZ=640
    volumes:
      - .:/app
    working_dir: /app
    command: python train_yolo.py
